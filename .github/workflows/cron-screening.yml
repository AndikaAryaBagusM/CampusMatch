# Daily Screening retry and clean-up (ADR 0002), formerly a Vercel Cron.
# Repo settings > Secrets and variables > Actions needs:
#   SITE_URL     the production origin, e.g. https://campusmatch.onrender.com
#   CRON_SECRET  the same value as CRON_SECRET on Render
name: Cron Screening

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A free Render instance sleeps when idle; the first try may only wake it.
      - name: Call /api/cron/screening
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors \
            --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/screening"
